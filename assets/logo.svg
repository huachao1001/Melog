<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Melog">
  <defs>
    <!-- 整词横向渐变，与徽章同色系 -->
    <linearGradient id="mlg-wg" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- monoline 手绘字标（10° 斜体）：
       M = metric 折线（右峰略高，呼应上涨趋势）
       e/l/o = 几何圆弧与直杆
       g = 尾勾收在一颗数据点上 -->
  <g transform="translate(24 0) skewX(-10)">
    <g stroke="url(#mlg-wg)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 100 L 8 30 L 44 84 L 80 26 L 80 100"/>
      <path d="M 98 78 L 142 78"/>
      <path d="M 142 78 A 22 22 0 1 0 135.6 93.6"/>
      <path d="M 166 28 L 166 100"/>
      <circle cx="212" cy="78" r="22"/>
      <circle cx="278" cy="78" r="22"/>
      <path d="M 300 56 L 300 108 Q 302 140 272 130"/>
    </g>
  </g>
</svg>
