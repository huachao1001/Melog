<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Melog 指标监控</title>
<script src="/static/echarts.min.js?v=2"></script>
<link rel="stylesheet" href="/static/css/style.css?v=2">
<link rel="icon" href="/static/logo.svg">
</head>
<body>
<header>
  <img src="/static/logo.svg" alt="Melog">
  <span id="status" class="dot" title="未连接"></span>
  <button id="logBtn" class="icon-btn" title="打开日志" aria-label="打开日志">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
  </button>
  <button id="themeBtn" class="icon-btn" title="切换主题" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
</header>
<div id="charts"><div id="empty">等待训练指标…</div></div>

<!-- 文件浏览器弹窗 -->
<div id="fbModal" class="hidden">
  <div class="fb-window">
    <div class="fb-head">
      <span>选择日志</span>
      <button id="fbClose" class="icon-btn" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="fb-pathbar">
      <button id="fbUp" class="icon-btn" title="上一级" aria-label="上一级">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <input id="fbPath" type="text" spellcheck="false" placeholder="输入路径后回车">
    </div>
    <div id="fbList"></div>
    <div class="fb-foot">
      <span id="fbMsg"></span>
      <div class="fb-actions">
        <button id="fbLive" class="ghost">回到实时</button>
        <button id="fbHere">打开此目录</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/static/js/main.js?v=2"></script>
</body>
</html>
