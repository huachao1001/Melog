<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Melog Logo 预览</title>
<style>
  body { background: #f5f6f8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2937; padding: 32px; }
  h2 { font-size: 14px; color: #6b7280; margin: 24px 0 8px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; width: 420px; }
  .card img { max-width: 100%; }
</style>
</head>
<body>
<h1 style="font-size:18px">Melog Logo</h1>

<h2>文字 Logo</h2>
<div class="row">
  <div class="card"><img src="logo.svg" alt="Melog"></div>
  <div class="card" style="transform: scale(0.6); transform-origin: left center;"><img src="logo.svg" alt="Melog"></div>
</div>
</body>
</html>
